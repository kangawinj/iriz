.back{padding:5px 0;color:var(--muted);background:transparent;border:0;font-weight:700;margin-bottom:15px}.heading{--accent:var(--present);margin-bottom:20px}.heading.past{--accent:var(--past)}.heading.future{--accent:var(--future)}.heading .eyebrow{color:var(--accent)}.heading p{color:var(--muted);margin:0}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0}.tab{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:9px 15px;font-weight:720}.tab.active{background:var(--ink);color:white;border-color:var(--ink)}.panels{display:grid;gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}.card h2{margin-bottom:12px}.ruleline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;padding:15px;background:#f0f5fa;border-radius:10px;overflow-wrap:anywhere}.rule-bullets{padding-left:22px;margin:10px 0}.rule-bullets li{padding-bottom:6px}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag{border:1px solid var(--line);border-radius:99px;background:var(--bg);font-size:13px;padding:3px 11px}.line-example{border-left:4px solid var(--present);padding:7px 0 7px 13px}.incorrect{color:var(--bad);font-weight:700}.chat{display:grid;gap:11px}.message{display:flex;gap:11px;align-items:flex-start}.avatar{width:37px;height:37px;background:var(--ink);color:white;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-weight:800}.avatar.mai{background:var(--present)}.bubble{background:var(--bg);padding:12px 15px;border-radius:5px 13px 13px 13px;flex:1}.bubble small{font-weight:800;color:var(--muted)}.translation{color:var(--muted);font-size:14px;margin-top:3px}.timeline{position:relative;padding:18px 6px 27px;margin:8px 0;min-height:130px;display:grid;align-items:center}.timeline-bg{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;border-radius:10px;overflow:hidden}.timeline-bg i:first-child{background:#fff0e0}.timeline-bg i:last-child{background:#f0ecff}.axis{height:4px;background:#7c8a9d;position:relative;z-index:1;border-radius:4px}.axis:before{content:"";position:absolute;left:50%;top:-52px;height:108px;border-left:3px dashed var(--present)}.axis:after{content:"➜";position:absolute;right:0;top:-18px;font-size:20px;color:#697a8f}.time-marks{display:flex;justify-content:space-between;position:absolute;inset:5px 15px auto;color:var(--muted);font-size:11px;font-weight:700}.moment{position:absolute;z-index:2;left:var(--time-pos,35%);top:50%;width:18px;height:18px;transform:translate(-50%,-43%);background:var(--moment-color,var(--past));border:3px solid white;box-shadow:0 0 0 3px var(--moment-color,var(--past));border-radius:50%}.moment.future{--moment-color:var(--future)}.moment.present{--moment-color:var(--present)}.time-caption{position:absolute;z-index:3;bottom:8px;left:15px;right:15px;text-align:center;color:var(--muted);font-size:13px}
.btn{border:0;padding:12px 20px;border-radius:10px;font-weight:800;color:white;background:var(--ink);min-height:46px}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.choice{background:var(--paper);color:var(--ink);border:2px solid var(--line);width:100%;text-align:left;font-size:17px;min-height:55px}.btn.choice.selected{border-color:var(--ink);box-shadow:inset 5px 0 0 var(--ink);background:var(--bg)}.btn.choice.correct{border-color:var(--good);background:var(--goodbg)}.btn.choice.incorrect{border-color:var(--bad);background:var(--badbg)}.btn.word{background:var(--paper);border:2px solid var(--line);color:var(--ink);min-height:44px;padding:8px 13px}.btn.word.used{opacity:.28;pointer-events:none}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.result-row{justify-content:center}.small{font-size:13px}.muted{color:var(--muted)}.exercise-intro{display:grid;gap:8px}.best{font-size:17px;font-weight:700}.quiz{max-width:720px;margin:auto;display:grid;gap:17px}.quiz-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.quiz-top .back{margin:0}.quiz-progress{height:9px;background:var(--line);border-radius:20px;overflow:hidden}.quiz-progress div{height:100%;width:0;background:var(--present);transition:width .18s}.question-kind{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:750}.question-text{font-size:clamp(20px,4.2vw,28px);font-weight:650;line-height:1.42;overflow-wrap:anywhere}.question-text .gap{display:inline-block;border-bottom:3px solid var(--ink);min-width:60px;height:1em;vertical-align:baseline}.options{display:grid;gap:10px}.answerbox{font-size:19px;line-height:1.5;border:2px solid var(--line);padding:12px 15px;background:var(--paper);width:100%;border-radius:10px;color:var(--ink)}.word-zone{border-bottom:3px solid var(--line);padding:10px 5px;min-height:64px;display:flex;flex-wrap:wrap;gap:8px}.word-bank{display:flex;flex-wrap:wrap;gap:8px}.feedback{padding:15px 18px;border:1px solid;border-radius:12px;background:var(--goodbg);border-color:var(--good)}.feedback.no{background:var(--badbg);border-color:var(--bad)}.feedback strong{display:block;font-size:18px}.feedback p{margin:4px 0}.score-box{text-align:center}.bigscore{font-size:clamp(60px,12vw,93px);line-height:1.1;font-weight:900;letter-spacing:-.05em}.choices{display:flex;flex-wrap:wrap;gap:9px}.bottom-help{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:18px}

<script>
(()=>{'use strict';

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const colors={present:'#087b8a',past:'#c46b12',future:'#6650ca'};
const order=['present','past','future'];
const groupLabels={present:'PRESENT LINE · สายปัจจุบัน',past:'PAST LINE · สายอดีต',future:'FUTURE LINE · สายอนาคต'};
const units=DB.units,byid=Object.fromEntries(units.map(u=>[u.id,u]));
let progress={xp:0,streak:0,last:'',units:{}};
const storageKey='tenseTales.offline.v1';
try{let prev=JSON.parse(localStorage.getItem(storageKey));if(prev&&typeof prev==='object')progress=Object.assign(progress,prev);}catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(progress));}catch{}}
const dstr=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
function touch(){const today=dstr(new Date());if(progress.last===today)return;const d=new Date();d.setDate(d.getDate()-1);progress.streak=progress.last===dstr(d)?progress.streak+1:1;progress.last=today;}
function stats(){ $('#xp').textContent=`${progress.xp} XP`;const d=new Date();d.setDate(d.getDate()-1);const active=progress.last===dstr(new Date())||progress.last===dstr(d);$('#streak').textContent=`${active?progress.streak:0} วันติด`;}
const best=id=>progress.units[id]?.best;
const stars=id=>best(id)==null?0:best(id)>=90?3:best(id)>=70?2:best(id)>0?1:0;
let current='home',unitId='ps',tab='story',quiz=null;
function listen(root=document){root.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));}
function nav(next){current=next;const root=$('#app');document.querySelectorAll('.navlinks button').forEach(b=>b.classList.toggle('active',b.dataset.view===(next==='lesson'||next==='quiz'&&quiz?.unit?'home':next==='result'&&quiz?.unit?'home':next)));
 if(next==='home')home();else if(next==='lesson')lesson();else if(next==='timeline')timeline();else if(next==='challenge')challenge();else if(next==='quiz')renderQuiz();else if(next==='result')result();stats();window.scrollTo(0,0);}
function home(){const rails=order.map(line=>`<section class="rail ${line}"><div class="rail-title">${groupLabels[line]}</div>${units.filter(u=>u.line===line).map(u=>`<button class="station" data-unit="${u.id}"><small>${u.code} · ${u.count} QUESTIONS</small><h3>${esc(u.title)}</h3><p>${esc(u.th)} · ${esc(u.tag)}</p><div class="station-foot"><span class="stars" aria-label="${stars(u.id)} ดาว">${[1,2,3].map(i=>i<=stars(u.id)?'★':'<span class="empty">★</span>').join('')}</span><span class="pill">${best(u.id)==null?'เริ่มเรียน':`ดีที่สุด ${best(u.id)}%`}</span></div></button>`).join('')}</section>`).join('');
 $('#app').innerHTML=`<div class="hero"><span class="eyebrow">ENGLISH B1 · OFFLINE EDITION</span><h1>เข้าใจ Tense ด้วยเรื่องสั้นและแบบฝึกหัด</h1><p>เรียนผ่านบทสนทนา กฎ ไทม์ไลน์ และแบบฝึกหัดภาษาอังกฤษพร้อมเฉลยภาษาไทย ใช้งานได้โดยไม่ต้องเชื่อมต่ออินเทอร์เน็ต</p><div class="intro-pills"><span class="pill">8 บทเรียน</span><span class="pill">400 ข้อทั้งหมด</span><span class="pill">3 รูปแบบโจทย์</span><span class="pill">คะแนนและดาว</span></div></div><div class="metro">${rails}</div>`;
 $('#app').querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{unitId=b.dataset.unit;tab='story';nav('lesson');}));}
function heading(u){return `<button class="back" id="returnHome">← กลับแผนที่บทเรียน</button><div class="heading ${u.line}"><span class="eyebrow">${u.code} · ${esc(groupLabels[u.line])}</span><h1>${esc(u.title)}</h1><p>${esc(u.th)} · ${esc(u.tag)}</p></div>`;}
function lesson(){const u=byid[unitId];let panel='';if(tab==='story')panel=`<div class="card"><h2>เรื่องสั้น · บทสนทนาตัวอย่าง</h2><p class="muted small">บทสนทนาภาษาอังกฤษพร้อมคำแปลไทย</p><div class="chat">${u.dialogue.map(([who,en,th])=>`<div class="message"><div class="avatar ${who==='Mai'?'mai':''}">${who[0]}</div><div class="bubble"><small>${esc(who)}</small><div>${esc(en)}</div><div class="translation">${esc(th)}</div></div></div>`).join('')}</div></div>`;
 else if(tab==='rules')panel=`<div class="card"><h2>รูปประโยค</h2><div class="ruleline">${esc(u.formula)}</div></div><div class="card"><h2>ใช้เมื่อไร</h2><ul class="rule-bullets">${u.uses.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="card"><h2>Signal Words</h2><div class="tags">${u.signals.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="card"><h2>ตัวอย่าง</h2><div class="line-example"><strong>${esc(u.example)}</strong><div class="muted small">${esc(u.meaning)}</div></div><p style="margin-top:18px"><span class="incorrect">ข้อผิดที่พบบ่อย:</span> ${esc(u.mistake)}</p></div>`;
 else if(tab==='time')panel=`<div class="card"><h2>${esc(u.title)} บนเส้นเวลา</h2>${timelineDiagram(u)}<p><strong>${esc(u.example)}</strong><span class="muted"> — ${esc(u.meaning)}</span></p><div class="ruleline">${esc(u.formula)}</div></div>`;
 else panel=`<div class="card exercise-intro"><span class="eyebrow">PRACTICE</span><h2>ฝึกทำโจทย์ 50 ข้อ</h2><p>โจทย์ไม่ซ้ำกัน 50 ข้อต่อบท มีแบบเลือกคำตอบ เติมคำ และเรียงประโยค คำตอบที่ผิดจะวนมาทบทวนอีกหนึ่งครั้ง</p><div class="best">${best(u.id)==null?'ยังไม่เคยทำแบบฝึกหัดบทนี้':`คะแนนที่ดีที่สุด ${best(u.id)}%`}</div><div class="row"><button id="start" class="btn">เริ่มทำ 50 ข้อ →</button></div></div>`;
 $('#app').innerHTML=heading(u)+`<div class="tabs">${[['story','เรื่องสั้น'],['rules','กฎและการใช้'],['time','ไทม์ไลน์'],['practice','ฝึกทำโจทย์']].map(([v,label])=>`<button class="tab ${tab===v?'active':''}" data-tab="${v}">${label}</button>`).join('')}</div><div class="panels">${panel}</div>`;
 $('#returnHome').addEventListener('click',()=>nav('home'));$('#app').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;lesson();}));const go=$('#start');if(go)go.addEventListener('click',()=>startQuiz(u.id,50));}
function timelineDiagram(u){const position={ps:50,pc:50,pa:24,pco:30,pp:43,ppf:20,fu:76,c1:72}[u.id];const cls=u.line==='present'?'present':u.line==='future'?'future':'';return `<div class="timeline" role="img" aria-label="เส้นเวลา: ${esc(u.title)}"><div class="timeline-bg"><i></i><i></i></div><div class="time-marks"><span>PAST</span><span>NOW</span><span>FUTURE</span></div><div class="axis"></div><div class="moment ${cls}" style="--time-pos:${position}%"></div><div class="time-caption">${esc(u.tag)}</div></div>`;}
const guesses=[['I usually take the bus to work.','ps'],['Look! The baby is sleeping.','pc'],['We visited a museum last Sunday.','pa'],['I was walking when it started to rain.','pco'],['She has lived here since 2018.','pp'],['When I got there, they had already eaten.','ppf'],["I'm going to start a new job.",'fu'],['If you study, you will pass.','c1']];
let currentGuess=0,guessPicked=null,guessScore=0,guessOrder=shuffle(guesses);
function timeline(){const u=byid[unitId];$('#app').innerHTML=`<div class="hero"><span class="eyebrow">TIMELINE EXPLORER</span><h1>ไทม์ไลน์ของ Tense</h1><p>เลือกบทเรียนเพื่อดูเส้นเวลา หรือฝึกทาย Tense จากประโยคตัวอย่าง</p></div><div class="tags">${units.map(x=>`<button class="tab ${x.id===unitId?'active':''}" data-choose="${x.id}">${esc(x.title)}</button>`).join('')}</div><div class="panels" style="margin-top:17px"><div class="card"><h2>${esc(u.title)}</h2>${timelineDiagram(u)}<p>${esc(u.example)}</p><div class="ruleline">${esc(u.formula)}</div><button class="btn secondary" id="openLesson" style="margin-top:12px">เปิดบทเรียน</button></div><div class="card" id="guess"></div></div>`;
 $('#app').querySelectorAll('[data-choose]').forEach(b=>b.addEventListener('click',()=>{unitId=b.dataset.choose;timeline();}));$('#openLesson').addEventListener('click',()=>{tab='story';nav('lesson');});renderGuess();}
function renderGuess(){const g=$('#guess');if(currentGuess>=guessOrder.length){g.innerHTML=`<h2>จบเกมทาย</h2><p>ทายถูก ${guessScore} จาก ${guessOrder.length} ข้อ</p><button class="btn" id="guessAgain">เล่นอีกครั้ง</button>`;$('#guessAgain').addEventListener('click',()=>{currentGuess=0;guessScore=0;guessOrder=shuffle(guesses);guessPicked=null;renderGuess();});return;}
 const [sentence,answer]=guessOrder[currentGuess];g.innerHTML=`<span class="eyebrow">ทายชื่อ Tense · ${currentGuess+1}/${guessOrder.length}</span><h2 style="margin-top:8px">${esc(sentence)}</h2><div class="choices">${units.map(u=>`<button class="tab" data-guess="${u.id}" ${guessPicked?'disabled':''}>${esc(u.title)}</button>`).join('')}</div>${guessPicked?`<div class="feedback ${guessPicked===answer?'':'no'}" style="margin:13px 0"><strong>${guessPicked===answer?'ถูกต้อง!':'ยังไม่ถูก'}</strong><p>คำตอบ: ${esc(byid[answer].title)}</p></div><button class="btn" id="guessNext">ข้อต่อไป</button>`:''}`;
 g.querySelectorAll('[data-guess]').forEach(b=>b.addEventListener('click',()=>{guessPicked=b.dataset.guess;if(guessPicked===answer){guessScore++;progress.xp+=5;touch();save();stats();}renderGuess();}));const next=$('#guessNext');if(next)next.addEventListener('click',()=>{currentGuess++;guessPicked=null;renderGuess();});}
function challenge(){$('#app').innerHTML=`<div class="hero"><span class="eyebrow">MIXED CHALLENGE</span><h1>ชาเลนจ์รวม Tense</h1><p>สุ่มโจทย์จากทั้ง 8 บท เลือกจำนวนข้อเพื่อฝึกการใช้ Tense ให้คล่องโดยไม่เห็นชื่อบทเรียน</p></div><div class="card"><h2>เลือกระดับชาเลนจ์</h2><p class="muted">แต่ละรอบสุ่มจากคลังโจทย์ทั้งหมด 400 ข้อ</p><div class="choices">${[10,25,50].map(n=>`<button class="btn" data-count="${n}">เริ่ม ${n} ข้อ</button>`).join('')}</div></div>`;$('#app').querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>startQuiz(null,+b.dataset.count)));}
function startQuiz(id,count){const items=id?DB.questions[id].map((e,i)=>({u:id,e,i})):units.flatMap(u=>DB.questions[u.id].map((e,i)=>({u:u.id,e,i})));const selected=shuffle(items).slice(0,count);quiz={unit:id,count,items:selected.slice(),source:selected.slice(),answered:new Set(),firstCorrect:0,miss:{},feedback:null,sel:null,typed:'',built:[],bank:null,done:0};nav('quiz');}
function quizTitle(){return quiz.unit?byid[quiz.unit].title:'ชาเลนจ์รวม';}
function renderQuiz(){if(!quiz||!quiz.items.length){nav('result');return;}const r=quiz,item=r.items[0],e=item.e,review=r.answered.has(`${item.u}:${item.i}`),feedback=r.feedback!==null;const kind={mc:'เลือกคำตอบ',fill:'เติมคำ',order:'เรียงประโยค'}[e.t];if(e.t==='order'&&!r.bank)r.bank=shuffle(e.words.map((w,i)=>({w,i})));
 let controls='';if(e.t==='mc')controls=`<div class="options">${e.o.map((choice,i)=>`<button class="btn choice ${feedback?(i===e.a?'correct':r.sel===i?'incorrect':''):(r.sel===i?'selected':'')}" data-opt="${i}" ${feedback?'disabled':''}>${esc(choice)}</button>`).join('')}</div>`;
 if(e.t==='fill')controls=`<input class="answerbox" id="typed" value="${esc(r.typed)}" placeholder="พิมพ์คำตอบภาษาอังกฤษ" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" ${feedback?'disabled':''}/>`;
 if(e.t==='order'){const picked=new Set(r.built);controls=`${e.th?`<p class="muted">${esc(e.th)}</p>`:''}<div class="word-zone">${r.built.map(i=>`<button class="btn word" data-rm="${i}" ${feedback?'disabled':''}>${esc(e.words[i])}</button>`).join('')}</div><div class="word-bank">${r.bank.map(({w,i})=>`<button class="btn word ${picked.has(i)?'used':''}" data-add="${i}" ${feedback?'disabled':''}>${esc(w)}</button>`).join('')}</div>`;}
 const answer=e.t==='mc'?e.o[e.a]:Array.isArray(e.a)?e.a[0]:e.a;const fb=feedback?`<div class="feedback ${r.feedback.ok?'':'no'}"><strong>${r.feedback.ok?'ถูกต้อง!':'ยังไม่ถูก'}</strong>${r.feedback.ok?'':`<p><strong style="display:inline">คำตอบที่ถูก: </strong>${esc(answer)}</p>`}<p>${esc(e.why)}</p></div>`:'';
 const question=e.t==='order'?'เรียงคำให้เป็นประโยคภาษาอังกฤษที่ถูกต้อง':esc(e.q).replace('___','<span class="gap" aria-label="ช่องว่าง"></span>');
 $('#app').innerHTML=`<div class="quiz"><div class="quiz-top"><button class="back" id="quit">← ออกจากแบบฝึกหัด</button><span class="pill">${esc(quizTitle())}</span></div><div class="quiz-progress"><div style="width:${r.done/r.count*100}%"></div></div><div class="row" style="justify-content:space-between"><span class="question-kind">${kind} ${review?'· ทบทวนข้อที่พลาด':''}</span><span class="pill">${r.done} / ${r.count} ข้อแล้ว</span></div><div class="question-text">${question}</div>${controls}${fb}<div class="row"><button class="btn" id="action" ${feedback?'': 'disabled'}>${feedback?'ต่อไป →':'ตรวจคำตอบ'}</button></div></div>`;
 $('#quit').addEventListener('click',()=>{if(r.unit){unitId=r.unit;tab='practice';nav('lesson');}else nav('challenge');});
 $('#app').querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{r.sel=+b.dataset.opt;renderQuiz();}));
 $('#app').querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.add;if(!r.built.includes(i)){r.built.push(i);renderQuiz();}}));
 $('#app').querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{r.built.splice(r.built.indexOf(+b.dataset.rm),1);renderQuiz();}));
 const inp=$('#typed');if(inp&&!feedback){inp.focus();inp.addEventListener('input',()=>{r.typed=inp.value;$('#action').disabled=!canCheck();});inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();act();}});}
 $('#action').disabled=!feedback&&!canCheck();$('#action').addEventListener('click',act);
}
function canCheck(){if(!quiz||!quiz.items.length)return false;const e=quiz.items[0].e;if(e.t==='mc')return quiz.sel!=null;if(e.t==='fill')return !!quiz.typed.trim();return quiz.built.length===e.words.length;}
function act(){const r=quiz,item=r.items[0],e=item.e;if(!r.feedback){if(!canCheck())return;const ok=e.t==='mc'?r.sel===e.a:e.t==='fill'?e.a.some(v=>norm(v)===norm(r.typed)):norm(r.built.map(i=>e.words[i]).join(' '))===norm(e.a);
 const k=`${item.u}:${item.i}`,first=!r.answered.has(k);if(first){r.answered.add(k);r.done++;if(ok){r.firstCorrect++;progress.xp+=10;}else{r.miss[item.u]=(r.miss[item.u]||0)+1;r.items.push(item);}}else if(ok)progress.xp+=3;touch();save();stats();r.feedback={ok};renderQuiz();}else{r.items.shift();r.feedback=null;r.sel=null;r.typed='';r.built=[];r.bank=null;renderQuiz();}}
function result(){if(!quiz)return nav('home');const r=quiz,pct=Math.round(r.firstCorrect/r.count*100);if(!r.saved){if(r.unit){const o=progress.units[r.unit]||{};o.best=Math.max(o.best||0,pct);progress.units[r.unit]=o;}progress.xp+=r.unit?20:30;save();r.saved=true;}
 const comment=pct>=90?'ยอดเยี่ยมมาก!':pct>=70?'ดีมาก!':pct>=40?'ทำได้ดี ลองทบทวนอีกนิด':'ลองอ่านกฎและฝึกอีกครั้ง';$('#app').innerHTML=`<div class="quiz"><div class="card score-box"><span class="eyebrow">RESULT · ${esc(quizTitle())}</span><div class="bigscore">${pct}%</div><h2>${comment}</h2><p class="muted">ถูกตั้งแต่ครั้งแรก ${r.firstCorrect} จาก ${r.count} ข้อ</p>${Object.keys(r.miss).length?`<div style="text-align:left;margin:18px 0"><strong>หัวข้อที่ควรทบทวน</strong><div class="tags" style="margin-top:10px">${Object.entries(r.miss).map(([id,num])=>`<button class="tag" data-review="${id}">${esc(byid[id].title)} · ${num} ข้อ</button>`).join('')}</div></div>`:''}<div class="row result-row"><button class="btn" id="again">ทำอีกครั้ง</button><button class="btn secondary" id="home2">กลับแผนที่</button></div></div></div>`;
 $('#again').addEventListener('click',()=>startQuiz(r.unit,r.count));$('#home2').addEventListener('click',()=>nav('home'));$('#app').querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{unitId=b.dataset.review;tab='rules';nav('lesson');}));stats();}
listen();nav('home');
if ('serviceWorker' in navigator && location.protocol === 'https:') {addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
