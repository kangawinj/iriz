<title>Tense Tales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,600..900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout concept: a transit map of time. Three lines (Present, Past, Future); each tense is a station. */
:root {
  --bg: #f2f5f7;
  --surface: #ffffff;
  --ink: #101b2d;
  --muted: #56667c;
  --line: #d3dce6;
  --present: #0e8f9c;
  --past: #d1710f;
  --future: #6a4fd8;
  --ok: #17895a;
  --bad: #cc3f37;
  --ok-bg: #e3f5ec;
  --bad-bg: #fbe8e6;
  --mark: #fff0b8;
  --on-line: #ffffff;
  --f-display: "Archivo", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111b; --surface: #131b29; --ink: #e8eef6; --muted: #93a3b8; --line: #263246;
    --present: #3cc6d4; --past: #f0a04b; --future: #a592ff;
    --ok: #46d39a; --bad: #ff7a70; --ok-bg: #12301f; --bad-bg: #351b1b; --mark: #4a3f10; --on-line: #0b111b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111b; --surface: #131b29; --ink: #e8eef6; --muted: #93a3b8; --line: #263246;
  --present: #3cc6d4; --past: #f0a04b; --future: #a592ff;
  --ok: #46d39a; --bad: #ff7a70; --ok-bg: #12301f; --bad-bg: #351b1b; --mark: #4a3f10; --on-line: #0b111b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); padding-inline: 16px; padding-block: 0 48px; }
.wrap { max-width: 980px; margin-inline: auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--future); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 100%; line-height: 1.15; margin: 0; text-wrap: balance; }
.mono { font-family: var(--f-mono); font-weight: 500; letter-spacing: .04em; }
.muted { color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 12px 10px; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.top-in { max-width: 980px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--f-display); font-weight: 900; font-stretch: 118%; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 4px; margin-inline-start: auto; flex-wrap: wrap; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; font-weight: 600; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); border-radius: 0; }
.stats { display: flex; gap: 8px; }
.pill { font-family: var(--f-mono); font-weight: 500; font-size: 13px; border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }

main { padding-block: 24px 0; }

/* Home: metro map */
.intro { display: grid; gap: 6px; margin-bottom: 24px; }
.intro h1 { font-size: clamp(28px, 6vw, 44px); font-weight: 900; font-stretch: 112%; }
.intro p { margin: 0; max-width: 60ch; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 28px 24px; align-items: start; }
.rail { --c: var(--present); position: relative; display: grid; gap: 14px; padding-inline-start: 34px; }
.rail.past { --c: var(--past); } .rail.future { --c: var(--future); }
.rail::before { content: ""; position: absolute; inset-inline-start: 11px; top: 38px; bottom: 26px; width: 8px; border-radius: 4px; background: var(--c); }
.rail-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rail-h .badge { background: var(--c); color: var(--on-line); font-family: var(--f-mono); font-size: 12px; padding: 3px 10px; border-radius: 6px; letter-spacing: .08em; }
.rail-h b { font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.station { position: relative; display: block; width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 14px 16px; }
.station::before { content: ""; position: absolute; inset-inline-start: -32px; top: 18px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg); border: 5px solid var(--c); }
.station.hub::after { content: ""; position: absolute; inset-inline-start: -37px; top: 13px; width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--present); }
.station:hover { border-color: var(--c); }
.station .code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.station h3 { font-size: 20px; font-weight: 800; margin-top: 2px; }
.station p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.stars { letter-spacing: 2px; font-size: 15px; color: var(--c); margin-top: 6px; display: block; }
.stars i { font-style: normal; opacity: .25; } .stars i.on { opacity: 1; }
.hubnote { font-size: 12px; color: var(--present); font-weight: 600; margin-top: 4px; display: block; }

/* Unit page */
.back { background: none; border: 0; color: var(--muted); padding: 4px 0; font-weight: 500; }
.uhead { --c: var(--present); display: grid; gap: 4px; padding-block: 8px 18px; }
.uhead.past { --c: var(--past); } .uhead.future { --c: var(--future); }
.uhead .code { color: var(--c); }
.uhead h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 900; font-stretch: 112%; }
.uhead p { margin: 0; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.tabs button { border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 99px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.panel { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.card h2 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }

/* Story */
.tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chat { display: grid; gap: 12px; }
.msg { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: start; }
.av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; background: var(--ink); color: var(--bg); }
.av.b { background: var(--c); color: var(--on-line); }
.bubble { background: var(--bg); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 10px 14px; text-align: start; width: 100%; }
.bubble .en { font-size: 18px; }
.bubble .th { display: none; color: var(--muted); font-size: 15px; margin-top: 4px; }
.show-th .bubble .th, .bubble.open .th { display: block; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 3px; font-weight: 600; }
.sw { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
.sw button { width: 44px; height: 26px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); position: relative; padding: 0; }
.sw button::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.sw button[aria-pressed="true"] { background: var(--ink); }
.sw button[aria-pressed="true"]::after { background: var(--bg); transform: translateX(18px); }

/* Rules */
table.form { width: 100%; border-collapse: collapse; }
.scroll { overflow-x: auto; }
table.form th, table.form td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.form th { font-family: var(--f-mono); font-weight: 500; font-size: 13px; color: var(--muted); }
table.form td.sign { font-family: var(--f-mono); font-size: 15px; white-space: nowrap; width: 1%; }
.use { display: grid; gap: 4px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.use:last-child { border-bottom: 0; padding-bottom: 0; }
.use b { font-weight: 600; }
.ex { font-size: 17px; border-inline-start: 4px solid var(--c); padding-inline-start: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: 14px; background: var(--bg); }
.mist { display: grid; gap: 4px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.mist:last-child { border-bottom: 0; }
.bad { color: var(--bad); } .good { color: var(--ok); }
.bad::before { content: "✗ "; } .good::before { content: "✓ "; }
.tip { background: var(--mark); border-radius: 10px; padding: 10px 14px; }
.irr { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-family: var(--f-mono); font-size: 14px; }

/* Timeline */
.tl { width: 100%; height: auto; display: block; }
.tl .zone-past { fill: color-mix(in srgb, var(--past) 12%, transparent); }
.tl .zone-fut { fill: color-mix(in srgb, var(--future) 12%, transparent); }
.tl .axis { stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
.tl .nowline { stroke: var(--present); stroke-width: 3; stroke-dasharray: 5 5; }
.tl text { font-family: var(--f-body); fill: var(--muted); font-size: 13px; }
.tl text.zl { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; }
.tl text.lb { fill: var(--ink); font-weight: 600; font-size: 14px; }
.tl text.num { fill: var(--on-line); font-weight: 800; font-size: 13px; text-anchor: middle; }
.tl .m { fill: var(--c); }
.tl .m2 { fill: var(--c2); }
.tl .soft { fill: var(--c); opacity: .3; }
.tl .stroke { stroke: var(--c); fill: none; stroke-width: 3; stroke-linecap: round; }
.tl .dash { stroke: var(--c); fill: none; stroke-width: 3; stroke-dasharray: 6 6; stroke-linecap: round; }
.tl .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s both; }
.tl .soft.pop { animation-name: pop-soft; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pop-soft { from { transform: scaleX(.2); opacity: 0; } to { transform: scaleX(1); opacity: .3; } }
.tlbox { --c: var(--present); --c2: var(--ink); }
.tlbox.past { --c: var(--past); } .tlbox.future { --c: var(--future); }
.formula { font-family: var(--f-mono); font-size: 15px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }

/* Buttons */
.btn { border: 0; background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 10px; font-weight: 600; min-height: 46px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn[disabled] { opacity: .35; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Runner */
.runner { max-width: 680px; margin-inline: auto; display: grid; gap: 16px; }
.prog { display: flex; gap: 4px; }
.prog i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.prog i.done { background: var(--c, var(--present)); }
.prog i.cur { background: var(--ink); }
.q { font-size: clamp(20px, 4.5vw, 26px); font-weight: 500; line-height: 1.4; }
.q .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--ink); text-align: center; color: var(--c, var(--present)); font-weight: 700; }
.qh { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.opts { display: grid; gap: 10px; }
.opt { text-align: start; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 18px; min-height: 52px; }
.opt:hover { border-color: var(--ink); }
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--bg); box-shadow: inset 4px 0 0 var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
input.ans { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.built { min-height: 58px; border-bottom: 3px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; padding-block: 6px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 18px; min-height: 44px; }
.tile.used { opacity: .25; pointer-events: none; }
.fb { border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.fb.ok { background: var(--ok-bg); border: 1px solid var(--ok); }
.fb.no { background: var(--bad-bg); border: 1px solid var(--bad); }
.fb b { font-family: var(--f-display); font-size: 18px; }
.fb .ans-line { font-size: 17px; font-weight: 600; }
.result { text-align: center; display: grid; gap: 14px; justify-items: center; padding-block: 24px; }
.result .big { font-family: var(--f-display); font-weight: 900; font-stretch: 118%; font-size: 64px; line-height: 1; }
.weak { text-align: start; width: 100%; }

/* Timeline explorer + guess game */
.tchips { display: flex; gap: 8px; flex-wrap: wrap; }
.tchip { --c: var(--present); border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; }
.tchip.past { --c: var(--past); } .tchip.future { --c: var(--future); }
.tchip[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 0 -4px 0 var(--c); }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.guess .sent { font-size: clamp(20px, 4vw, 26px); font-weight: 500; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  <button class="brand" id="home" aria-label="หน้าแรก">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><path d="M6 11h20" stroke="var(--present)" stroke-width="3" stroke-linecap="round"/><path d="M6 16h20" stroke="var(--past)" stroke-width="3" stroke-linecap="round"/><path d="M6 21h20" stroke="var(--future)" stroke-width="3" stroke-linecap="round"/></svg>
    Tense Tales
  </button>
  <div class="stats"><span class="pill" id="xp"></span><span class="pill" id="streak"></span></div>
  <nav class="nav" aria-label="เมนูหลัก">
    <button data-v="home">แผนที่บทเรียน</button>

  </nav>
</div></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hl = (s) => esc(s).replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>');
const norm = (s) => s.toLowerCase().replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim().replace(/[.!?]$/, '');
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ───────── Exercise helpers ───────── */
const mc = (q, o, a, why) => ({ t: 'mc', q, o, a, why });
const fill = (q, a, why, tip) => ({ t: 'fill', q, a, why, tip });
const order = (words, th, why) => ({ t: 'order', words, a: words.join(' '), th, why });

/* ───────── Course content ───────── */
const LINES = {
  present: { badge: 'PRESENT LINE', th: 'สายปัจจุบัน' },
  past: { badge: 'PAST LINE', th: 'สายอดีต' },
  future: { badge: 'FUTURE LINE', th: 'สายอนาคต' },
};

const UNITS = [
{
  id: 'ps', code: 'P1', line: 'present', title: 'Present Simple', th: 'ปัจจุบันธรรมดา', tag: 'กิจวัตร ความจริง ตารางเวลา', tl: 'habit',
  story: { title: 'Mai ทำงานที่คาเฟ่', lines: [
    ['Mai', 'I [[work]] at a small café near the station.', 'ฉันทำงานที่คาเฟ่เล็กๆ ใกล้สถานี'],
    ['Mai', 'It [[opens]] at six, so I [[get up]] at five every day.', 'คาเฟ่เปิดหกโมง ฉันเลยตื่นตีห้าทุกวัน'],
    ['Tom', '[[Does]] your boss [[like]] early birds?', 'เจ้านายคุณชอบคนตื่นเช้าไหม'],
    ['Mai', 'He [[doesn\'t care]]. He just [[wants]] fresh coffee at six!', 'เขาไม่สนหรอก เขาแค่อยากได้กาแฟสดตอนหกโมง'],
    ['Tom', 'Fair enough. The sun [[rises]] early in summer anyway.', 'ก็ยุติธรรมดี หน้าร้อนดวงอาทิตย์ก็ขึ้นเช้าอยู่แล้ว'],
  ] },
  rules: {
    form: [['+', 'I / you / we / they work', 'he / she / it work<b>s</b>'], ['−', 'I / you / we / they <b>don\'t</b> work', 'he / she / it <b>doesn\'t</b> work'], ['?', '<b>Do</b> I / you / we / they work?', '<b>Does</b> he / she / it work?']],
    uses: [
      ['กิจวัตรและนิสัย', 'I get up at five every day.'],
      ['ความจริงที่เป็นอยู่เสมอ', 'The sun rises in the east.'],
      ['ตารางเวลาที่แน่นอน (รถ หนัง คลาส)', 'The train leaves at 8:15.'],
    ],
    signals: ['always', 'usually', 'often', 'sometimes', 'never', 'every day', 'on Mondays', 'once a week'],
    mistakes: [
      ['She work here.', 'She works here.', 'he / she / it ต้องเติม -s หรือ -es ท้ายกริยา'],
      ['Does she works here?', 'Does she work here?', 'มี does ช่วยแล้ว กริยากลับไปเป็นรูปเดิม'],
      ['He don\'t like fish.', 'He doesn\'t like fish.', 'he / she / it ใช้ doesn\'t ไม่ใช่ don\'t'],
    ],
    tip: 'เติม -es หลัง s, sh, ch, x, o (goes, watches) และ พยัญชนะ+y เปลี่ยนเป็น -ies (study → studies)',
  },
  ex: [
    mc('My sister ___ in a bank.', ['work', 'works', 'is work'], 1, 'she เป็นบุรุษที่สาม เอกพจน์ กริยาต้องเติม -s'),
    mc('___ you often play football?', ['Do', 'Does', 'Are'], 0, 'you ใช้ Do ในประโยคคำถาม Present Simple'),
    fill('He ___ TV every evening. (watch)', ['watches'], 'ลงท้ายด้วย ch เติม -es: watch → watches'),
    fill('She ___ spicy food. (not like)', ['doesn\'t like', 'does not like'], 'ปฏิเสธ he / she / it ใช้ doesn\'t + กริยาช่อง 1 (ไม่เติม -s)'),
    order(['Does', 'your', 'brother', 'speak', 'English?'], 'พี่ชายหรือน้องชายของคุณพูดภาษาอังกฤษไหม', 'Does + ประธาน + กริยาช่อง 1'),
    mc('Water ___ at 100 degrees.', ['boils', 'is boiling', 'boil'], 0, 'ความจริงทางวิทยาศาสตร์ ใช้ Present Simple'),
    mc('The film ___ at 7:30 tonight.', ['starts', 'start', 'starting'], 0, 'ตารางเวลาที่แน่นอนใช้ Present Simple'),
  ],

/* ───────── Timeline drawing ───────── */
function timeline(kind) {
  const y = 86, now = 300;
  const T = (x, yy, txt, cls = '') => `<text x="${x}" y="${yy}" text-anchor="middle" class="${cls}">${esc(txt)}</text>`;
  const dot = (x, r, cls = 'm', d = 0) => `<circle class="${cls} pop" style="animation-delay:${d}ms" cx="${x}" cy="${y}" r="${r}"/>`;
  let body = '';
  if (kind === 'habit') {
    [60, 120, 180, 240, 300, 360, 420, 480, 540].forEach((x, i) => { body += dot(x, 7, 'm', i * 60); });
    body += T(300, 44, 'ทำซ้ำเป็นประจำ ทั้งอดีต ปัจจุบัน อนาคต', 'lb');
  } else if (kind === 'now') {
    body += `<rect class="m pop" x="248" y="${y - 13}" width="104" height="26" rx="13"/>` + T(300, 52, 'กำลังเกิดขึ้นตอนนี้', 'lb') + T(300, 128, 'am / is / are + V-ing');
  } else if (kind === 'point') {
    body += dot(130, 11) + T(130, 56, 'เกิดและจบแล้ว', 'lb') + T(130, 128, 'yesterday · last week · in 2019');
  } else if (kind === 'span') {
    body += `<rect class="soft pop" x="70" y="${y - 13}" width="170" height="26" rx="13"/>` + dot(180, 11, 'm2', 250) +
      T(155, 128, 'was / were + V-ing (ยาว)') + T(180, 56, 'เหตุการณ์สั้นแทรกเข้ามา', 'lb');
  } else if (kind === 'perfect') {
    body += `<rect class="soft pop" x="90" y="${y - 9}" width="210" height="18" rx="9"/>` + dot(130, 11, 'm2', 100) + dot(215, 11, 'm2', 200) +
      `<circle class="m pop" style="animation-delay:300ms" cx="${now}" cy="${y}" r="12"/>` +
      T(190, 56, 'เกิดในอดีต แต่เชื่อมถึงตอนนี้', 'lb') + T(190, 128, 'have / has + V3');
  } else if (kind === 'before') {
    body += dot(80, 13, 'm', 0) + dot(200, 13, 'm2', 250) +
      `<path class="stroke" d="M96 ${y} H182"/><path class="stroke" d="M174 ${y - 7} L184 ${y} L174 ${y + 7}"/>` +
      `<text class="num" x="80" y="${y + 5}">1</text><text class="num" x="200" y="${y + 5}">2</text>` +
      T(80, 128, 'had + V3 (ก่อน)') + T(200, 128, 'Past Simple (หลัง)') + T(140, 56, 'เหตุการณ์ที่เกิดก่อน → หลัง', 'lb');
  } else if (kind === 'future') {
    body += `<path class="dash" d="M300 ${y - 12} C 340 20, 470 20, 520 ${y - 12}"/>` + dot(430, 11, 'm', 100) + dot(520, 11, 'm2', 300) +
      T(430, 128, 'will (ตัดสินใจตอนนี้)') + T(520, 128, 'going to (แผน)') + T(430, 56, 'อนาคต', 'lb');
  } else if (kind === 'branch') {
    body += `<rect class="m pop" x="352" y="${y - 12}" width="24" height="24" rx="3" transform="rotate(45 364 ${y})"/>` +
      `<path class="stroke" d="M388 ${y} H492"/><path class="stroke" d="M484 ${y - 7} L494 ${y} L484 ${y + 7}"/>` + dot(520, 11, 'm2', 300) +
      T(364, 128, 'if + Present Simple') + T(520, 128, 'will + V1') + T(440, 56, 'ถ้าเงื่อนไขเกิด → ผลลัพธ์', 'lb');
  }
  return `<svg class="tl" viewBox="0 0 600 150" role="img" aria-label="ไทม์ไลน์">
    <rect class="zone-past" x="14" y="26" width="276" height="108" rx="12"/>
    <rect class="zone-fut" x="310" y="26" width="276" height="108" rx="12"/>
    <line class="axis" x1="16" y1="${y}" x2="584" y2="${y}"/><path class="axis" d="M574 ${y - 8} L586 ${y} L574 ${y + 8}" fill="none"/>
    <line class="nowline" x1="${now}" y1="30" x2="${now}" y2="120"/>
    <text class="zl" x="30" y="20">อดีต · PAST</text><text class="zl" x="${now}" y="20" text-anchor="middle">NOW</text><text class="zl" x="570" y="20" text-anchor="end">อนาคต · FUTURE</text>
    ${body}</svg>`;
}

/* ───────── Progress (per-viewer convenience) ───────── */
const KEY = 'tenseTales.v1';
let P = { xp: 0, streak: 0, last: '', units: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') P = Object.assign(P, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const dayStr = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
function touchStreak() {
  const today = dayStr(new Date());
  if (P.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  P.streak = P.last === dayStr(y) ? P.streak + 1 : 1;
  P.last = today;
}
function paintStats() {
  $('#xp').textContent = `${P.xp} XP`;
  const alive = P.last && (P.last === dayStr(new Date()) || (() => { const y = new Date(); y.setDate(y.getDate() - 1); return P.last === dayStr(y); })());
  $('#streak').textContent = `${alive ? P.streak : 0} วันติด`;
}
const starsFor = (id) => { const b = (P.units[id] || {}).best; return b == null ? 0 : b >= 90 ? 3 : b >= 70 ? 2 : b >= 1 ? 1 : 0; };

function nav(v, extra = {}) {

  });

}

      <div class="formula" style="margin-top:10px">${u.rules.form[0][1]}${u.rules.form[0][2] ? ' ' + (u.rules.form[0][2].length < 40 ? '· ' + u.rules.form[0][2] : '') : ''}</div>
      <p style="margin:10px 0 0" class="ex">${esc(u.rules.uses[0][1])}</p>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="openu">เปิดบทเรียน ${u.code}</button></div></div>
    <div class="card guess" id="guess"></div></div>`;
  main.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', () => nav('timeline', { sel: b.dataset.sel })));
  $('#openu').addEventListener('click', () => nav('unit', { id: u.id, tab: 'story' }));
  renderGuess();
}
function renderGuess() {
  const g = gstate, box = $('#guess');
  if (g.i >= g.order.length) {
    box.innerHTML = `<h2>จบเกมทาย</h2><p>ทายถูก <b>${g.score}</b> จาก ${g.order.length} ข้อ</p><button class="btn" id="again">เล่นอีกรอบ</button>`;
    $('#again').addEventListener('click', () => { gstate = { i: 0, order: shuffle(GUESS.map((_, i) => i)), score: 0, done: 0, picked: null }; renderGuess(); });
    return;
  }
  const [s, ans, why] = GUESS[g.order[g.i]];
  const au = BYID[ans];
  box.innerHTML = `<div class="qh">ประโยคนี้ใช้ tense อะไร · ข้อ ${g.i + 1}/${g.order.length}</div><div class="sent" style="margin:8px 0 14px">${esc(s)}</div>
    <div class="tchips">${UNITS.map((x) => {
      let st = '';
      if (g.picked) st = x.id === ans ? 'right' : x.id === g.picked ? 'wrong' : '';
      return `<button class="tchip ${x.line}" data-g="${x.id}" ${g.picked ? 'disabled' : ''} style="${st === 'right' ? 'background:var(--ok-bg);border-color:var(--ok)' : st === 'wrong' ? 'background:var(--bad-bg);border-color:var(--bad)' : ''}">${esc(x.title)}</button>`;
    }).join('')}</div>
    ${g.picked ? `<div class="fb ${g.picked === ans ? 'ok' : 'no'}" style="margin-top:14px" aria-live="polite"><b>${g.picked === ans ? 'ถูกต้อง!' : 'ยังไม่ใช่'}</b>
      <div class="ans-line">${esc(au.title)}</div><div>${esc(why)}</div></div>
      <div class="card tlbox ${au.line}" style="margin-top:12px;--c:var(--${au.line})">${timeline(au.tl)}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="nx">ข้อต่อไป</button></div>` : ''}`;
  box.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => {
    g.picked = b.dataset.g; if (g.picked === ans) { g.score++; P.xp += 5; touchStreak(); save(); paintStats(); } renderGuess();
  }));
  const nx = $('#nx'); if (nx) nx.addEventListener('click', () => { g.i++; g.picked = null; renderGuess(); });
}

/* Challenge */
function renderChallenge() {
  const done = UNITS.filter((u) => starsFor(u.id) > 0).length;
  main.innerHTML = `<div class="intro"><h1>ชาเลนจ์รวม tense</h1><p>สุ่มโจทย์ 10 ข้อจากทุกสถานี ต้องเลือก tense ให้ถูกเองโดยไม่มีบทเรียนบอกใบ้ เหมาะสำหรับทบทวนหลังเรียนหลายบท</p></div>
    <div class="card"><p style="margin-top:0">ผ่านมาแล้ว ${done} จาก ${UNITS.length} สถานี</p><div class="row"><button class="btn" id="go">เริ่มชาเลนจ์ 10 ข้อ</button></div></div>`;
  $('#go').addEventListener('click', () => {
    const all = UNITS.flatMap((u) => u.ex.map((e) => ({ e, u: u.id })));
    startRun({ title: 'ชาเลนจ์รวม', line: 'present', unit: null, list: shuffle(all).slice(0, 10) });
  });
}

/* Runner */
let run = null;
function startRun(cfg) {
  run = { cfg, queue: cfg.list.slice(), total: cfg.list.length, i: 0, first: 0, miss: {}, seen: new Set(), phase: 'ask', sel: null, built: [], bank: null, retry: new Set() };
  nav('run');
}
function renderRun() {
  const r = run, item = r.queue[0];
  if (!item) { finishRun(); return; }
  const e = item.e;
  const line = r.cfg.unit ? BYID[r.cfg.unit].line : BYID[item.u].line;
  if (e.t === 'order' && !r.bank) r.bank = shuffle(e.words.map((w, i) => ({ w, i })));
  const q = e.t === 'order' ? 'เรียงคำให้เป็นประโยคที่ถูกต้อง' : esc(e.q).replace('___', '<span class="gap">&nbsp;&nbsp;&nbsp;</span>');
  const fin = r.phase === 'fb';
  let body = '';
  if (e.t === 'mc') {
    body = `<div class="opts">${e.o.map((o, i) => {
      let c = ''; if (fin) c = i === e.a ? 'right' : i === r.sel ? 'wrong' : '';
      return `<button class="opt ${c}" data-i="${i}" aria-pressed="${!fin && r.sel === i}" ${fin ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('')}</div>`;
  } else if (e.t === 'fill') {
    body = `<input class="ans" id="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์คำตอบ" ${fin ? 'disabled' : ''} value="${fin ? esc(r.typed || '') : ''}">`;
  } else {
    const used = new Set(r.built);
    body = `${e.th ? `<p class="muted" style="margin:0">${esc(e.th)}</p>` : ''}<div class="built" id="built">${r.built.map((id) => `<button class="tile" data-rm="${id}" ${fin ? 'disabled' : ''}>${esc(e.words[id])}</button>`).join('')}</div>
      <div class="bank">${r.bank.map((t) => `<button class="tile ${used.has(t.i) ? 'used' : ''}" data-add="${t.i}" ${fin ? 'disabled' : ''}>${esc(t.w)}</button>`).join('')}</div>`;
  }
  let fb = '';
  if (fin) {
    const ok = r.lastOk;
    const ans = e.t === 'mc' ? e.o[e.a] : e.t === 'fill' ? e.a[0] : e.a;
    fb = `<div class="fb ${ok ? 'ok' : 'no'}" aria-live="polite"><b>${ok ? 'ถูกต้อง!' : 'ยังไม่ถูก'}</b>${ok ? '' : `<div class="ans-line">คำตอบ: ${esc(ans)}</div>`}<div>${esc(e.why)}</div></div>`;
  }
  main.innerHTML = `<div class="runner" style="--c: var(--${line})">
    <div class="row" style="justify-content:space-between"><button class="back" id="quit">← ออก</button><span class="mono muted">${esc(r.cfg.title)}</span></div>
    <div class="prog" aria-hidden="true">${Array.from({ length: r.total }, (_, k) => `<i class="${k < r.i ? 'done' : k === r.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="qh">${e.t === 'mc' ? 'เลือกคำตอบ' : e.t === 'fill' ? 'เติมคำ' : 'เรียงประโยค'} · ข้อ ${Math.min(r.i + 1, r.total)}/${r.total}</div>
    <div class="q">${q}</div>${body}${fb}
    <div class="row"><button class="btn" id="act" ${!fin && !canCheck() ? 'disabled' : ''}>${fin ? 'ต่อไป' : 'ตรวจคำตอบ'}</button></div></div>`;
  $('#quit').addEventListener('click', () => nav(r.cfg.unit ? 'unit' : 'challenge', r.cfg.unit ? { id: r.cfg.unit, tab: 'practice' } : {}));
  main.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => { r.sel = +b.dataset.i; renderRun(); }));
  main.querySelectorAll('[data-add]').forEach((b) => b.addEventListener('click', () => { r.built.push(+b.dataset.add); renderRun(); }));
  main.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { r.built.splice(r.built.indexOf(+b.dataset.rm), 1); renderRun(); }));
  const inp = $('#ans');
  if (inp) {
    if (!fin) { inp.focus(); inp.addEventListener('input', () => { r.typed = inp.value; $('#act').disabled = !canCheck(); }); }
    inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); act(); } });
  }
  $('#act').addEventListener('click', act);
  if (fin) $('#act').focus();
}
function canCheck() {
  const r = run, e = r.queue[0].e;
  if (e.t === 'mc') return r.sel != null;
  if (e.t === 'fill') return (r.typed || '').trim().length > 0;
  return r.built.length === e.words.length;
}
function act() {
  const r = run, item = r.queue[0], e = item.e;
  if (r.phase === 'ask') {
    if (!canCheck()) return;
    let ok;
    if (e.t === 'mc') ok = r.sel === e.a;
    else if (e.t === 'fill') ok = e.a.some((a) => norm(a) === norm(r.typed));
    else ok = norm(r.built.map((id) => e.words[id]).join(' ')) === norm(e.a);
    r.lastOk = ok; r.phase = 'fb';
    const firstTry = !r.seen.has(item);
    if (firstTry) { r.seen.add(item); if (ok) { r.first++; P.xp += 10; } else { r.miss[item.u] = (r.miss[item.u] || 0) + 1; } }
    else if (ok) P.xp += 3;
    touchStreak(); save(); paintStats();
    if (!ok && firstTry) r.queue.push(item); // one more try at the end
    renderRun();
  } else {
    r.queue.shift();
    r.phase = 'ask'; r.sel = null; r.typed = ''; r.built = []; r.bank = null;
    // progress counts distinct questions finished (correct, or retried once)
    r.i = r.total - new Set(r.queue).size;
    renderRun();
  }
}
function finishRun() {
  const r = run, pct = Math.round((r.first / r.total) * 100);
  if (r.cfg.unit) { const o = P.units[r.cfg.unit] || {}; o.best = Math.max(o.best || 0, pct); P.units[r.cfg.unit] = o; }
  P.xp += r.cfg.unit ? 20 : 30; save();
  r.pct = pct; nav('result');
}
function renderResult() {
  const r = run, pct = r.pct;
  const weak = Object.entries(r.miss).sort((a, b) => b[1] - a[1]);
  const msg = pct >= 90 ? 'ยอดเยี่ยมมาก!' : pct >= 70 ? 'ดีมาก เกือบเต็มแล้ว' : pct >= 40 ? 'ใช้ได้ ทบทวนกฎอีกนิดจะดีขึ้น' : 'ไม่เป็นไร ลองอ่านกฎแล้วทำใหม่ได้เลย';
  main.innerHTML = `<div class="runner"><div class="result card" style="--c:var(--present)">
    <div class="mono muted">${esc(r.cfg.title)}</div><div class="big">${pct}%</div><div>${msg}</div>
    <div class="muted">ถูกตั้งแต่ครั้งแรก ${r.first} จาก ${r.total} ข้อ · ได้ XP เพิ่ม</div>
    ${weak.length ? `<div class="weak"><b>ควรทบทวน</b><div class="chips" style="margin-top:8px">${weak.map(([id, n]) => `<button class="chip" data-open="${id}">${esc(BYID[id].title)} (พลาด ${n})</button>`).join('')}</div></div>` : ''}
    <div class="row" style="justify-content:center"><button class="btn" id="again">ทำอีกครั้ง</button><button class="btn ghost" id="home2">กลับแผนที่</button></div></div></div>`;
  main.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => nav('unit', { id: b.dataset.open, tab: 'rules' })));
  $('#again').addEventListener('click', () => {
    if (r.cfg.unit) startRun({ title: r.cfg.title, line: r.cfg.line, unit: r.cfg.unit, list: r.cfg.list });
    else { const all = UNITS.flatMap((u) => u.ex.map((e) => ({ e, u: u.id }))); startRun({ title: 'ชาเลนจ์รวม', line: 'present', unit: null, list: shuffle(all).slice(0, 10) }); }
  });
  $('#home2').addEventListener('click', () => nav('home'));
}

$('#home').addEventListener('click', () => nav('home'));
document.querySelectorAll('.nav button').forEach((b) => b.addEventListener('click', () => nav(b.dataset.v)));
nav('home');
})();
</script>

</body>
